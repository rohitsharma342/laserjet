name: laserjet
description: A user-friendly mobile app designed to simplify the process of purchasing printers.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.1
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^4.2.1
  badges: ^3.1.2
  http: ^1.1.2
  flutter_cache_manager: ^3.3.1
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  crypto: ^3.0.3
  path: ^1.8.3
  flutter_keyboard_visibility_web: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true